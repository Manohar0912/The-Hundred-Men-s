name: Refresh and deploy live dashboard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clear previous failed-refresh marker
        run: rm -f data/last_failed_refresh.json

      - name: Refresh and validate cricket data
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_data.py

      - name: Report refresh result
        run: |
          if [ "${{ steps.refresh.outcome }}" = "success" ]; then
            echo "Data refresh succeeded. Deploying newly verified data."
          else
            echo "::warning::Data refresh failed validation. Deploying the latest UI with the last verified current.json."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
